# Zenith Rewards on GCP
# Deploy: docker compose -f docker-compose.gcp.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zenith
      POSTGRES_PASSWORD: zenith
      POSTGRES_DB: zenith
    ports: ["5432:5432"]
    volumes: [zenith-pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    env_file: .env.gcp
    environment:
      WORKER_URL: http://worker-api:8001
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      worker-api: { condition: service_started }
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  worker-api:
    build:
      context: ./apps/worker
    env_file: .env.gcp
    ports: ["8001:8001"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

  worker-arq:
    build:
      context: ./apps/worker
    env_file: .env.gcp
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: arq worker_settings.WorkerSettings
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports: ["5173:5173"]
    env_file: .env.gcp
    environment:
      VITE_API_BASE_URL: http://<YOUR_GCP_VM_IP>:8000
      VITE_WORKER_BASE_URL: http://<YOUR_GCP_VM_IP>:8001
    # Build for production and serve via Vite preview
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  zenith-pgdata:
