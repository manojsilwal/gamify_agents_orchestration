<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer Game View - Agent Swarm</title>
    <style>
        body { font-family: monospace; background: #0f172a; color: #0f0; margin: 0; padding: 0; overflow: hidden; }
        .nav { position: absolute; top: 1rem; left: 1rem; z-index: 100; }
        .nav a { color: #fff; text-decoration: none; font-family: sans-serif; }
        .dashboard { position: absolute; top: 1rem; right: 1rem; background: rgba(0,0,0,0.8); padding: 1rem; border: 1px solid #0f0; width: 300px; height: 90vh; overflow-y: auto; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        .agent { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #0f0; transition: all 0.5s ease; box-shadow: 0 0 10px #0f0; display: flex; justify-content: center; align-items: center; }
        .agent::after { content: attr(data-id); position: absolute; top: -20px; color: #fff; font-size: 10px; }
        .agent.supervisor { width: 40px; height: 40px; background: #f0f; box-shadow: 0 0 20px #f0f; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .agent.thinking { animation: pulse 1s infinite; background: #ff0; box-shadow: 0 0 10px #ff0; }
        .agent.dead { opacity: 0; transform: scale(0); }
        .log { font-size: 10px; margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 2px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="nav"><a href="index.html">&larr; Back to User View</a></div>
    <div id="canvas-container">
        <!-- Agents will be dynamically added here -->
    </div>
    <div class="dashboard">
        <h3>System Logs</h3>
        <div id="logs"></div>
    </div>
    <script src="engineer.js"></script>
</body>
</html>
